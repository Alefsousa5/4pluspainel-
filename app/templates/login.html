<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="login-logo">4+</div>
    <h1>{{ app_name }}</h1>
    <p class="muted">Gerenciador de contas SSH</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% if demo_mode %}<div class="alert info">Modo demonstração: o painel não está rodando como root, então as contas não são aplicadas no sistema.</div>{% endif %}

    <label>Usuário
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label>Senha
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn primary block">Entrar</button>
    <small class="muted center">{{ app_name }} v{{ app_version }}</small>
  </form>
</body>
</html>
